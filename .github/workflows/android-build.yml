name: Android build and regression
on:
  workflow_dispatch:
    inputs:
      run_emulator:
        description: Run device regression after compilation
        type: boolean
        default: false
      emulator_api:
        description: Android API for device regression
        type: choice
        options: ['35', '37']
        default: '35'
      release_smoke_tag:
        description: Optional published release APK installation and upgrade check
        type: string
        default: ''
      signed_apk_blob:
        description: Optional locally signed APK test object (read only)
        type: string
        default: ''
      signed_apk_sha256:
        description: Required SHA-256 for the signed APK test object
        type: string
        default: ''
      signed_smoke_only:
        description: Only install and launch signed APKs, without recompilation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: ${{ !inputs.signed_smoke_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
          cache-read-only: false
      - name: Install matching compile SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "build-tools;35.0.0"'
      - name: Verify native dependency
        run: test "$(sha256sum app/libs/hev-socks5-tunnel-2.19.1.aar | cut -d' ' -f1)" = '107958f7a07051386248ba8dba778b63d8dcefdfb2c3665b0ee9a8c93de5f6ca'
      - name: Build complete feature module and host
        run: gradle --no-daemon :schedule:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleAndroidTest
      - name: Collect unsigned release and signer tooling
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/app-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" artifacts/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" artifacts/apksigner-api35.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging artifacts/app-release-unsigned.apk > artifacts/apk-badging-api35.txt
          cp "$ANDROID_HOME/build-tools/37.0.0/NOTICE.txt" artifacts/BUILD-TOOLS-NOTICE.txt
          sha256sum artifacts/* > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-miuix-build
          path: |
            android/artifacts/
            android/app/build/reports/
            android/schedule/build/reports/
          if-no-files-found: warn
  emulator:
    if: ${{ inputs.run_emulator && !inputs.signed_smoke_only }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
          cache-read-only: false
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - run: gradle --no-daemon :app:assembleDebug :app:assembleAndroidTest :vpnprobe:assembleDebug
      - run: sudo chmod 666 /dev/kvm
      - name: Controlled SOCKS fixture
        run: python3 app/src/androidTest/fixtures/socks_fixture.py > /tmp/cqust-socks-fixture.log 2>&1 &
      - name: Fetch locally signed release for installation check
        if: ${{ inputs.release_smoke_tag != '' || inputs.signed_apk_blob != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_smoke_tag }}
          SIGNED_APK_BLOB: ${{ inputs.signed_apk_blob }}
          SIGNED_APK_SHA256: ${{ inputs.signed_apk_sha256 }}
        run: bash ci/fetch-signed-apk.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.emulator_api == '37' && '37.0' || '35' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disk-size: 8192M
          emulator-options: -no-window -gpu ${{ inputs.emulator_api == '37' && 'software' || 'swiftshader_indirect' }} -no-snapshot -noaudio -no-boot-anim
          working-directory: android
          script: bash ci/device-regression.sh '${{ inputs.emulator_api || '35' }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-miuix-device-results
          path: |
            android/artifacts/screenshots/
            android/artifacts/instrumentation.txt
            android/artifacts/emulator-crash.log
            android/artifacts/release-install.txt
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
  signed_install:
    if: ${{ inputs.signed_smoke_only && inputs.signed_apk_blob != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact signed APK using read-only access
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_APK_BLOB: ${{ inputs.signed_apk_blob }}
          SIGNED_APK_SHA256: ${{ inputs.signed_apk_sha256 }}
        run: bash ci/fetch-signed-apk.sh
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disk-size: 8192M
          working-directory: android
          script: bash ci/release-install-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-release-install-results
          path: |
            android/artifacts/release-install.txt
            android/artifacts/release-package.txt
            android/artifacts/release-window.xml
            android/artifacts/screenshots/14-signed-release.png
