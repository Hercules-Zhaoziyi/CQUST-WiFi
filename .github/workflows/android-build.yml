name: Android beta build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify pinned native dependency
        run: |
          test "$(sha256sum app/libs/hev-socks5-tunnel-2.19.1.aar | cut -d' ' -f1)" = "107958f7a07051386248ba8dba778b63d8dcefdfb2c3665b0ee9a8c93de5f6ca"
          test "$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)" = "498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17"
      - name: Build and unit test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleAndroidTest
      - name: Collect test APK
        if: success()
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/app-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" artifacts/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/NOTICE.txt" artifacts/BUILD-TOOLS-NOTICE.txt
          sha256sum artifacts/* > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-beta-build
          path: |
            android/artifacts/
            android/app/build/reports/tests/
            android/app/build/outputs/apk/androidTest/
          if-no-files-found: warn
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: ['35', '37.0']
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM for isolated test emulator
        run: |
          sudo chmod 666 /dev/kvm
      - name: Start controlled SOCKS endpoint
        run: python3 app/src/androidTest/fixtures/socks_fixture.py > /tmp/cqust-socks-fixture.log 2>&1 &
      - name: Compile test APKs before starting memory-intensive emulator
        run: gradle --no-daemon :app:assembleDebug :app:assembleAndroidTest :vpnprobe:assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          system-image-api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 8192M
          ram-size: 3072M
          heap-size: 512M
          working-directory: android
          script: |
            gradle --no-daemon :vpnprobe:assembleDebug
            for attempt in $(seq 1 30); do if adb shell svc wifi disable && adb shell svc data disable; then break; fi; sleep 2; done
            adb shell df -h /data
            adb install -r vpnprobe/build/outputs/apk/debug/vpnprobe-debug.apk || (adb logcat -d -t 300; exit 1)
            mkdir -p artifacts
            if [ '${{ matrix.api }}' = '37.0' ]; then adb install --no-streaming -r app/build/outputs/apk/debug/app-debug.apk && adb install --no-streaming -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk && adb shell am instrument -w -r cn.ziyis.cqustwifi.test/androidx.test.runner.AndroidJUnitRunner | tee artifacts/instrumentation-api37.txt && grep -Eq 'OK \([0-9]+ tests?\)' artifacts/instrumentation-api37.txt; else gradle --no-daemon -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true :app:connectedDebugAndroidTest; fi
            mkdir -p artifacts && adb pull /sdcard/Android/data/cn.ziyis.cqustwifi/files/screenshots artifacts/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-results-api${{ matrix.api }}
          path: |
            android/artifacts/screenshots/
            android/artifacts/instrumentation-api37.txt
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            /tmp/cqust-socks-fixture.log
