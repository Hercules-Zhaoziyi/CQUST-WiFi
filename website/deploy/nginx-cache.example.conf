# HTML should revalidate rather than remain stale in a browser cache.
location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# Query-versioned CSS/JS: HTML references ?v=521-platforms.
# Short caching avoids trapping independently updated files for long periods.
location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=3600" always;
}

